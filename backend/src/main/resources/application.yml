server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: jt-learning
  datasource:
    url: jdbc:postgresql://localhost:5432/jt_learning
    username: jt_user
    password: jt_password
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

