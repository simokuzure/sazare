server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: jt-learning
  datasource:
    url: jdbc:postgresql://localhost:5432/jt_learning
    username: jt_user
    password: jt_password
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379

ai:
  provider: ${AI_PROVIDER:google}
  request-timeout: ${AI_REQUEST_TIMEOUT:180s}
  providers:
    google:
      model: ${GOOGLE_AI_MODEL:gemini-3.6-flash}
      embedding-model: ${GOOGLE_AI_EMBEDDING_MODEL:gemini-embedding-001}
      api-key: ${GOOGLE_AI_API_KEY:}
      base-url: ${GOOGLE_AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
