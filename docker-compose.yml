services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    container_name: sazare-postgres
    environment:
      POSTGRES_DB: sazare
      POSTGRES_USER: sazare_user
      POSTGRES_PASSWORD: sazare_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sazare_user -d sazare"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sazare-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
